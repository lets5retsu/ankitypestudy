<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>元素周期表タイピング暗記ゲーム</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#ffffff;color:#172033}
header{padding:10px 16px;background:#ffffff;color:#172033;border-bottom:1px solid #e5e7eb}
h1{margin:0;font-size:18px}
main{max-width:1400px;margin:auto;padding:8px}
.controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button,select,input{font:inherit;border:1px solid #cbd3df;border-radius:6px;padding:5px 8px;background:white;font-size:13px}
button{cursor:pointer}
button.primary{background:#2563eb;color:#fff;border-color:#2563eb}
button.danger{background:#fff0f0;color:#b42318;border-color:#f0b4b4}
button.active{background:#172033;color:white}

.panel{background:#ffffff;border:1px solid #d9e0ea;border-radius:12px;padding:8px 12px;margin-bottom:6px}
.toprow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
#answer{width:100%;font-size:16px;padding:8px;transition:border-color 0.2s, background-color 0.2s}
#answer.correct-flash{border-color:#22c55e;background-color:#f0fdf4}
#answer.error-flash{border-color:#ef4444;background-color:#fef2f2;animation:shake 0.2s}

@keyframes shake{
  0%, 100%{transform:translateX(0)}
  25%{transform:translateX(-4px)}
  75%{transform:translateX(4px)}
}

.stats{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}
.badge{padding:3px 7px;border-radius:999px;background:#f1f5f9}
.good{color:#087443;font-weight:bold}
.bad{color:#b42318;font-weight:bold}
#message{min-height:18px;margin-top:2px;font-weight:700;font-size:13px}
#results{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;max-height:80px;overflow:auto}
.result{padding:3px 6px;border-radius:6px;background:#e8f5ed;color:#08683b;font-size:12px}
.help{font-size:11px;color:#657085}

/* 周期表エリア */
#table-container {
  background: #f8fafc;
  border: 1px solid #d9e0ea;
  border-radius: 12px;
  padding: 12px;
  overflow-x: auto;
  margin-bottom: 6px;
}
.periodic-grid {
  display: grid;
  grid-template-columns: repeat(18, 55px);
  grid-template-rows: repeat(10, 55px);
  gap: 3px;
  width: max-content;
}
.element-cell {
  background: #f1f5f9;
  border: 1px solid #cbd5e1;
  border-radius: 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  position: relative;
  transition: transform 0.1s, background-color 0.3s;
}
.element-cell.revealed {
  background: #dcfce7;
  border-color: #22c55e;
  color: #166534;
  animation: popIn 0.3s;
}
.element-cell.unanswered {
  background: #fee2e2;
  border-color: #f87171;
  color: #991b1b;
}
@keyframes popIn {
  0%{transform:scale(0.8)}
  70%{transform:scale(1.05)}
  100%{transform:scale(1)}
}

.elem-num { font-size: 8px; color: #64748b; }
.elem-sym { font-weight: bold; font-size: 14px; }
.elem-name { font-size: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 90%; }

@media(max-width:800px){
  .toprow{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header><h1>🧪 元素周期表タイピング暗記ゲーム</h1></header>
<main>
<div class="panel">
  <div class="controls">
    <button class="mode active" data-range="1-118">全元素 (1〜118)</button>
    <button class="mode" data-range="1-20">主要元素 (1〜20)</button>
    <button class="mode" data-range="1-36">第1〜4周期 (1〜36)</button>
    <label class="badge" style="cursor:pointer"><input id="highlightUnanswered" type="checkbox"> 未正解の場所を強調</label>
    <button id="start" class="primary">ゲーム開始 / リセット</button>
    <button id="giveup" class="danger">降参・答え合わせ</button>
  </div>
  <div class="toprow">
    <input id="answer" autocomplete="off" spellcheck="false" placeholder="元素名 または 元素記号を入力して Enter">
    <div class="stats"><span class="badge">正解 <b id="correct">0</b></span><span class="badge">残り <b id="remaining">0</b></span><span class="badge">時間 <b id="time">0:00</b></span></div>
    <div id="accuracy">正答率 --%</div>
  </div>
  <div id="message"></div>
  <div class="help">入力 → Enter。元素名（漢字・ひらがな・カタカナ）または 元素記号（例: H, he, Na）で判定されます。</div>
  <div id="results"></div>
</div>

<!-- 画面下部の穴あき周期表 -->
<div id="table-container">
  <div id="periodicGrid" class="periodic-grid"></div>
</div>

<div class="panel help" style="margin-top:6px">
  データソース：標準元素周期表データ（原子番号 1 〜 118）
</div>
</main>

function norm(s){
  return (s||"").trim().normalize("NFKC").toLowerCase();
}

let currentRange = "1-118";
let targetElements = [];
let revealed = new Set();
let unanswered = new Set();
let startTime = 0;
let timerId = null;
let gameOver = false;
let lastResultNames = [];

const answerEl = document.getElementById("answer");

function setMsg(s, cls="") {
  const e = document.getElementById("message");
  if(e){ e.textContent = s; e.className = cls; }
}

function getFilteredElements() {
  if(currentRange === "1-20") return ELEMENTS.filter(e => e.no <= 20);
  if(currentRange === "1-36") return ELEMENTS.filter(e => e.no <= 36);
  return ELEMENTS;
}
function playCorrectSound(){
  playTone(880, 0.12, "sine", 0.07, 0);
  playTone(1175, 0.16, "sine", 0.07, 0.10);
}

function playIncorrectSound(){
  playTone(220, 0.16, "sawtooth", 0.045, 0);
  playTone(165, 0.20, "sawtooth", 0.035, 0.13);
}

function initGame() {
  stopClock();
  answerEl.value = "";
  targetElements = getFilteredElements();
  revealed.clear();
  unanswered.clear();
  gameOver = false;
  lastResultNames = [];
  
  renderTable();
  startClock();
  updateStats();
  setMsg(`${targetElements.length}個の元素を入力してください。`);
  answerEl.focus();
}

function renderTable() {
  const grid = document.getElementById("periodicGrid");
  grid.innerHTML = "";

  const highlightUnanswered = document.getElementById("highlightUnanswered").checked;

  for(let r = 1; r <= 10; r++) {
    for(let c = 1; c <= 18; c++) {
      const cell = document.createElement("div");
      cell.style.gridRow = r;
      cell.style.gridColumn = c;

      const el = targetElements.find(item => {
        if (r === 8 && item.p === 8) return item.g === c;
        if (r === 9 && item.p === 9) return item.g === c;
        if (r >= 8 && item.p >= 8) return false;
        return item.p === r && item.g === c;
      });

      if(el) {
        cell.className = "element-cell";
        const isRev = revealed.has(el.no);
        const isUnans = unanswered.has(el.no);

        if(isRev) {
          cell.classList.add("revealed");
          cell.innerHTML = `<span class="elem-num">${el.no}</span><span class="elem-sym">${el.sym}</span><span class="elem-name">${el.name}</span>`;
        } else if(isUnans) {
          cell.classList.add("unanswered");
          cell.innerHTML = `<span class="elem-num">${el.no}</span><span class="elem-sym">${el.sym}</span><span class="elem-name">${el.name}</span>`;
        } else {
          if(highlightUnanswered) {
            cell.style.borderColor = "#d97706";
            cell.style.background = "#fde68a";
          }
          cell.innerHTML = `<span class="elem-num">${el.no}</span><span class="elem-sym" style="opacity:0.3">?</span>`;
        }
        cell.title = isRev || gameOver ? `${el.no}: ${el.name} (${el.sym})` : `原子番号 ${el.no}`;
      } else {
        cell.style.visibility = "hidden";
      }
      grid.appendChild(cell);
    }
  }
}

function updateStats() {
  document.getElementById("correct").textContent = revealed.size;
  document.getElementById("remaining").textContent = Math.max(0, targetElements.length - revealed.size);
  document.getElementById("accuracy").textContent = `正答率 ${targetElements.length ? Math.round(revealed.size/targetElements.length*100) : 0}%`;

  const html = lastResultNames.map(name => `<span class="result">${name}</span>`).join("");
  document.getElementById("results").innerHTML = html;
}

function updateTime() {
  if(!startTime) return;
  const sec = Math.floor((Date.now()-startTime)/1000), m = Math.floor(sec/60), s = String(sec%60).padStart(2,"0");
  document.getElementById("time").textContent = `${m}:${s}`;
}

function startClock() { clearInterval(timerId); startTime = Date.now(); timerId = setInterval(updateTime, 500); updateTime(); }
function stopClock() { clearInterval(timerId); timerId = null; }

// 入力判定機構（正誤判定と視覚フィードバック）
function submit() {
  if(gameOver || !targetElements.length) return;
  const rawVal = answerEl.value;
  const val = norm(rawVal);
  if(!val) return;

  const hits = [];
  targetElements.forEach(el => {
    if(revealed.has(el.no)) return;

    const validStrings = [
      norm(el.sym),
      norm(el.name),
      ...(el.kana || []).map(k => norm(k))
    ];

    if(validStrings.includes(val)) {
      hits.push(el);
    }
  });

  // すでに正解済みのものを入力した場合のチェック
  let alreadyRevealed = false;
  if (!hits.length) {
    targetElements.forEach(el => {
      if (revealed.has(el.no)) {
        const validStrings = [norm(el.sym), norm(el.name), ...(el.kana || []).map(k => norm(k))];
        if (validStrings.includes(val)) {
          alreadyRevealed = true;
        }
      }
    });
  }

  if(hits.length) {
    // 正解の処理
    hits.forEach(el => revealed.add(el.no));
    lastResultNames = hits.map(el => `${el.name}(${el.sym})`);
    answerEl.value = "";
    
    // 成功演出（入力欄のフラッシュ）
    answerEl.classList.add("correct-flash");
    setTimeout(() => answerEl.classList.remove("correct-flash"), 300);

    setMsg(hits.length >= 2 ? `${hits.length}件正解！` : `正解：${hits[0].name} (${hits[0].sym})`, "good");
    playCorrectSound();

    renderTable();
    updateStats();
    

    if(revealed.size === targetElements.length) {
      gameOver = true;
      stopClock();
      setMsg(`全問正解おめでとうございます！ タイム: ${document.getElementById("time").textContent}`, "good");
    }
  } else {
    // 不正解の処理
    answerEl.classList.add("error-flash");
    setTimeout(() => answerEl.classList.remove("error-flash"), 200);

    if (alreadyRevealed) {
      setMsg(`「${rawVal}」はすでに回答済みです。`, "bad");
      playIncorrectSound();
    } else {
      setMsg(`「${rawVal}」は不正解です。`, "bad");
      playIncorrectSound();
    }
    updateStats();
    
  }
}

function giveUp() {
  if(gameOver || !targetElements.length) return;
  stopClock();
  gameOver = true;
  unanswered.clear();
  
  targetElements.forEach(el => {
    if(!revealed.has(el.no)) {
      unanswered.add(el.no);
    }
  });
  
  renderTable();
  updateStats();
  setMsg("降参しました。未回答の元素が赤く表示されています。", "bad");
}

// イベントリスナー
document.querySelectorAll(".mode").forEach(btn => {
  btn.addEventListener("click", (e) => {
    if(!revealed.size || window.confirm("モードを変更すると現在の進行状況がリセットされます。よろしいですか？")) {
      document.querySelectorAll(".mode").forEach(b => b.classList.remove("active"));
      e.target.classList.add("active");
      currentRange = e.target.dataset.range;
      initGame();
    }
  });
});

answerEl.addEventListener("keydown", (e) => {
  if(e.key === "Enter" && !e.isComposing) {
    submit();
  }
});

document.getElementById("start").addEventListener("click", () => {
  if(window.confirm("ゲームをリセットして最初からやり直しますか？")) {
    initGame();
  }
});

document.getElementById("giveup").addEventListener("click", () => {
  if(gameOver) return;
  if(window.confirm("本当に降参して答え合わせをしますか？")) {
    giveUp();
  }
});

document.getElementById("highlightUnanswered").addEventListener("change", () => {
  renderTable();
});

// 初期ロード
initGame();
</script>
</body>
</html>
